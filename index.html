  <style>
    :root{--ink:#14312d;--forest:#0d3b36;--gold:#f5b942;--paper:#fffdf7;--mist:#e7f0ea;--coral:#d95d39;--good:#18794e;--bad:#b63c2d}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#f8f1df,#e5f0ea);font-family:ui-rounded,"Nunito",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}button{font:inherit;cursor:pointer}#app{width:min(100%,720px);min-height:100vh;margin:auto;padding:clamp(22px,5vw,46px) clamp(18px,5vw,42px);display:flex;flex-direction:column}.screen{display:none;flex:1}.screen.active{display:flex;flex-direction:column}.start{justify-content:center;align-items:center;text-align:center}.seal{width:92px;height:92px;margin-bottom:25px;border-radius:50%;background:var(--forest);color:var(--gold);display:grid;place-items:center;font-size:42px;box-shadow:0 12px 28px #0d3b3633}.start h1{font-family:Georgia,serif;font-size:clamp(2rem,8vw,3.2rem);line-height:1.05;margin:0 0 12px}.start p{max-width:340px;margin:0 0 34px;color:#54716a;font-size:1rem}.primary{border:0;border-radius:999px;background:var(--forest);color:white;padding:16px 34px;font-weight:800;letter-spacing:.08em;box-shadow:0 8px 0 #082a26;transition:.15s transform,.15s box-shadow}.primary:active{transform:translateY(5px);box-shadow:0 3px 0 #082a26}.copyright{text-align:center;color:#668078;font-size:.75rem;padding-top:28px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px;font-size:.85rem;font-weight:800}.badge{background:var(--mist);padding:8px 12px;border-radius:99px}.progress{height:9px;background:#d5e2d9;border-radius:99px;overflow:hidden;margin-bottom:28px}.progress b{display:block;height:100%;width:10%;background:var(--gold);border-radius:inherit;transition:width .35s}.topic{color:var(--coral);font-weight:900;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:9px}.card{background:var(--paper);border:1px solid #e9e1d2;border-radius:22px;padding:clamp(22px,5vw,34px);box-shadow:0 15px 35px #405f5020}.question{font-family:Georgia,serif;font-size:clamp(1.28rem,4.7vw,1.75rem);line-height:1.32;margin:0 0 25px}.answers{display:grid;gap:11px}.answer{width:100%;text-align:left;border:2px solid #dce6df;border-radius:14px;background:#fff;padding:14px 15px;color:var(--ink);font-weight:650;line-height:1.3;transition:.15s}.answer:hover:not(:disabled){border-color:#88a99b;background:#f7fbf8}.answer:disabled{cursor:default}.answer.correct{border-color:var(--good);background:#e5f6eb;color:#10663e}.answer.wrong{border-color:var(--bad);background:#fbeae7;color:#9f3226}.feedback{min-height:31px;margin:18px 3px 0;font-weight:750}.feedback.good{color:var(--good)}.feedback.bad{color:var(--bad)}.next{align-self:flex-end;margin-top:10px;border:0;background:transparent;color:var(--forest);font-weight:900;padding:10px;display:none}.result{justify-content:center;text-align:center}.result .score{font-family:Georgia,serif;font-size:clamp(4.5rem,18vw,7rem);line-height:1;color:var(--forest);margin:12px 0}.result h2{font-size:1.4rem;margin:0}.result p{color:#557069;margin:14px auto 25px;max-width:360px}.coverage{margin:20px 0 24px;text-align:left;background:var(--mist);padding:14px 17px;border-radius:14px;font-size:.85rem;color:#45675e}.coverage strong{color:var(--forest)}#confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}.piece{position:absolute;width:10px;height:16px;top:-20px;animation:fall 1.45s linear forwards}@keyframes fall{to{transform:translate(var(--x),110vh) rotate(720deg);opacity:.95}}@media(max-width:380px){#app{padding:18px 14px}.card{padding:20px 16px}.answer{padding:12px}.top{font-size:.76rem}}@media(min-width:900px){#app{min-height:100vh}}
  </style>

<body><main id="app">
  <section id="start" class="screen start active"><div class="seal">✦</div><h1>Praktis<br>Sejarah</h1><p>Tingkatan 1 &amp; 2 · KSSM</p><button class="primary" id="startBtn">MULAKAN</button><div class="copyright">© Ridzuan Atan</div></section>

<script>

['T2 · Bab 1: Kerajaan Alam Melayu','Apakah maksud konsep Alam Melayu?',['Kawasan kepulauan dan tanah besar Asia Tenggara yang berkongsi persamaan','Benua Eropah','Negara di Asia Barat sahaja','Kawasan kutub'],0],

['T2 · Bab 5: Kesultanan Melayu Melaka','Mengapakah Melaka menjadi pelabuhan entrepot yang penting?',['Kedudukannya strategik di Selat Melaka','Terletak di kawasan kutub','Tiada pelabuhan','Tidak menerima pedagang'],0],

['T2 · Bab 6: Warisan Melaka','Hukum Kanun Melaka berkaitan dengan…',['Undang-undang darat dan pentadbiran','Cuaca laut sahaja','Seni bina moden','Sukan tradisional'],0],

['T2 · Bab 8: Kedah Kelantan Negeri Sembilan Perlis','Siapakah ketua dalam setiap luak di Negeri Sembilan?',['Penghulu','Laksamana','Syahbandar','Bendahara'],0],

['T2 · Bab 9: Pahang Perak Terengganu Selangor','Batu Bersurat Terengganu membuktikan pengaruh…',['Islam dan tulisan Jawi','Yunani dan Latin','Mesir Purba','Eropah moden'],0],
['T2 · Bab 10: Sarawak dan Sabah','Masyarakat Iban di Sarawak terkenal dengan rumah…',['Panjang','Batu','Terapung','Bawah tanah'],0],
['T2 · Bab 10: Sarawak dan Sabah','Antara kegiatan ekonomi tradisional penting di Sabah ialah…',['Perdagangan hasil hutan dan laut','Penanaman gandum di salji','Pembuatan kereta api','Perlombongan berlian sahaja'],0]
];
let pool=[],current=[],i=0,score=0,cycle=0;const $=id=>document.getElementById(id);
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function newCycle(){cycle++; score=0;i=0;let byTopic={};bank.forEach(q=>(byTopic[q[0]]??=[]).push(q));let picks=[];let topics=shuffle(Object.keys(byTopic));topics.forEach(t=>{if(picks.length<10)picks.push(shuffle(byTopic[t])[0])}); if(picks.length<10)picks=picks.concat(shuffle(bank.filter(q=>!picks.includes(q))).slice(0,10-picks.length)); current=shuffle(picks);show('quiz');render()}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active')}
function render(){let q=current[i];$('cycle').textContent='Kitaran '+cycle;$('counter').textContent=(i+1)+' / 10';$('bar').style.width=((i+1)*10)+'%';$('topic').textContent=q[0];$('question').textContent=q[1];$('feedback').textContent='';$('feedback').className='feedback';$('next').style.display='none';let order=shuffle(q[2].map((x,n)=>({x,n})));$('answers').innerHTML='';order.forEach(a=>{let b=document.createElement('button');b.className='answer';b.textContent=a.x;b.onclick=()=>answer(a.n,b);$('answers').appendChild(b)})}
function answer(n,button){let q=current[i],right=n===q[3];document.querySelectorAll('.answer').forEach(b=>{b.disabled=true;if(b.textContent===q[2][q[3]])b.classList.add('correct')});if(right){score++;$('feedback').textContent='Tepat! Syabas.';$('feedback').classList.add('good');blast()}else{$('feedback').textContent='Belum tepat. Jawapan: '+q[2][q[3]];$('feedback').classList.add('bad');button.classList.add('wrong')}$('next').textContent=i===9?'LIHAT MARKAH →':'SOALAN SETERUSNYA →';$('next').style.display='block'}
function blast(){let c=$('confetti'),colors=['#f5b942','#d95d39','#198c6a','#6254a8','#f58a7a'];for(let n=0;n<70;n++){let e=document.createElement('i');e.className='piece';e.style.left=Math.random()*100+'vw';e.style.background=colors[n%colors.length];e.style.setProperty('--x',(Math.random()*220-110)+'px');e.style.animationDelay=Math.random()*.22+'s';c.appendChild(e);setTimeout(()=>e.remove(),1800)}}
function finish(){let pct=Math.round(score/10*100);$('percent').textContent=pct+'%';$('resultText').textContent=pct>=80?'Cemerlang! Teruskan momentum ini.':pct>=50?'Bagus. Ulang kitaran untuk kukuhkan ingatan.':'Terus berlatih—setiap kitaran membawa kemajuan.';$('coverage').textContent=[...new Set(current.map(q=>q[0].replace(/T[12] · /,'')))].join(' · ');show('result')}
$('startBtn').onclick=newCycle;$('again').onclick=newCycle;$('next').onclick=()=>{if(i===9)finish();else{i++;render()}};
</script></body></html>
